name: ADU-180 Labs demo validation

on:
  pull_request:
    paths:
      - '**'
  push:
    branches:
      - feat/ADU-180-labs-demo-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labs-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:labs
